name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Every standard GitHub-hosted runner image, free for public
        # repositories: each OS version on x64 and ARM64. Each comes with a
        # different OpenSSH, whose `ssh -G` the tool relies on. Labels that
        # differ only in their Visual Studio or Xcode version are left out.
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - windows-2022
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-26-intel
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: OpenSSH client
        run: ssh -V
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked --no-fail-fast

  msrv:
    name: msrv (rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --all-targets --locked
