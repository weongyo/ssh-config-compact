[package]
name = "ssh-config-compact"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Clean up, merge, or format SSH config with confirmation and backups"
license = "BSD-2-Clause"
repository = "https://github.com/weongyo/ssh-config-compact"
readme = "README.md"
keywords = ["ssh", "ssh-config", "openssh", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
