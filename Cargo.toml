[package]
name = "ssh-config-compact"
version = "0.1.0"
edition = "2024"
description = "Clean up, merge, or format SSH config with confirmation and backups"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27"
